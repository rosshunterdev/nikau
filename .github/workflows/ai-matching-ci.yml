name: ai-matching-ci

on:
  pull_request:
    paths:
      - "services/ai-matching/**"
      - ".github/workflows/ai-matching-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-matching
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest